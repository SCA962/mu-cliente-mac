name: Compilar cliente Mac (MuMain v1.2.5 + parches)

# Compila el cliente MuMain para macOS Apple Silicon en un Mac de GitHub Actions,
# con los mismos pasos que usa el proyecto en su CI (job build-macos de ci.yml),
# mas la aplicacion de cliente-mac-parches.patch antes de compilar.
# Resultado: un Release con el .tar.gz del runtime (sin data) y su sha256.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS arm64 Release (editor OFF) con parches
    runs-on: macos-latest

    steps:
      - name: Receta y parche (este repositorio)
        uses: actions/checkout@v4
        with:
          path: receta

      - name: Codigo de MuMain v1.2.5 (con submodulos)
        uses: actions/checkout@v4
        with:
          repository: yesid-bocanegra/MuMain
          ref: v1.2.5
          submodules: recursive
          path: MuMain

      - name: Aplicar parche
        working-directory: MuMain
        run: |
          echo "commit base: $(git rev-parse HEAD)"
          git apply --check ../receta/cliente-mac-parches.patch
          git apply ../receta/cliente-mac-parches.patch
          git diff --stat
          grep -q "IsPress(VK_LBUTTON) || SEASON3B::IsRelease(VK_LBUTTON)" src/source/UI/NewUI/Inventory/NewUITrade.cpp && echo "parche 4 (intercambio) aplicado en el codigo"

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Herramientas (Homebrew)
        run: brew install cmake ninja openssl@3 curl brotli glslang spirv-cross jpeg-turbo

      - name: Configurar
        working-directory: MuMain
        run: >
          cmake --preset macos-arm64
          -B out/build/macos-ci
          -DENABLE_EDITOR=OFF
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Compilar
        working-directory: MuMain
        run: cmake --build out/build/macos-ci --config Release

      - name: Tests
        working-directory: MuMain
        run: >
          ctest --test-dir out/build/macos-ci --build-config Release
          --output-on-failure
          --no-tests=error

      - name: Validar runtime y parches
        working-directory: MuMain
        run: |
          rt="out/build/macos-ci/src/Release/Main.app/Contents/MacOS"
          for p in "$rt/Main" "$rt/MUnique.Client.Library.dylib" "$rt/config.ini" "$rt/shaders"; do
            if [ ! -e "$p" ]; then echo "falta: $p" >&2; exit 1; fi
          done
          for p in "$rt/Data" "$rt/fonts"; do
            if [ -e "$p" ]; then echo "data inesperada en el runtime: $p" >&2; exit 1; fi
          done
          file "$rt/Main"
          echo "--- librerias que carga Main:"
          otool -L "$rt/Main"
          echo "--- shaders:"
          ls "$rt/shaders"
          if strings "$rt/Main" | grep -q "not retrying until another track is requested"; then
            echo "parche de musica presente en el binario"
          else
            echo "el parche de musica NO esta en el binario" >&2; exit 1
          fi
          if grep -q "ServerIP=localhost" "$rt/config.ini"; then
            echo "config.ini es la plantilla (localhost)"
          else
            echo "config.ini inesperado" >&2; exit 1
          fi

      - name: Empaquetar
        run: |
          NOMBRE="MuMain-macos-native-arm64-release-editor-off-no-data-parchado.tar.gz"
          tar -czf "$NOMBRE" -C MuMain/out/build/macos-ci/src/Release Main.app
          shasum -a 256 "$NOMBRE" | tee sha256.txt
          ls -l "$NOMBRE"
          echo "NOMBRE=$NOMBRE" >> "$GITHUB_ENV"

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cliente-mac-parchado
          path: |
            MuMain-macos-native-arm64-release-editor-off-no-data-parchado.tar.gz
            sha256.txt
          if-no-files-found: error

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.5-mac-parche4-r${{ github.run_number }}"
          {
            echo "MuMain v1.2.5 (commit base $(git -C MuMain rev-parse HEAD)) compilado para macOS arm64,"
            echo "editor OFF, sin data, con los cuatro parches de cliente-mac-parches.patch aplicados (shaders, musica, MU Helper, intercambio)."
            echo
            echo "sha256 del .tar.gz:"
            echo '```'
            cat sha256.txt
            echo '```'
          } > notas.md
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Cliente Mac parchado ($TAG)" --notes-file notas.md "$NOMBRE" sha256.txt
