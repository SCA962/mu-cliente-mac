name: Compilar clientes Mac y Windows (MuMain v1.2.5 + parches)

# Compila el cliente MuMain v1.2.5 con los diez parches de cliente-mac-parches.patch,
# en un Mac de GitHub Actions (arm64) y en un Windows de GitHub Actions (x64, MSVC),
# con los mismos pasos que usa el proyecto en su CI (jobs build-macos y build-windows de ci.yml).
# Resultado: un Release con
#   - el .tar.gz del runtime de Mac (sin data), para actualizar-cliente-mac.sh
#   - el .zip para los jugadores de Windows (Main.exe, DLL y shaders; sin Data, fonts ni config.ini)
#   - el .tar.gz del runtime completo de Windows (con config.ini de plantilla), por si hay que armar un cliente de cero
#   - sha256 de todo
# Se lanza a mano desde la pestana Actions (Run workflow), no en cada push.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS arm64 Release (editor OFF) con parches
    runs-on: macos-latest

    steps:
      - name: Receta y parche (este repositorio)
        uses: actions/checkout@v4
        with:
          path: receta

      - name: Codigo de MuMain v1.2.5 (con submodulos)
        uses: actions/checkout@v4
        with:
          repository: yesid-bocanegra/MuMain
          ref: v1.2.5
          submodules: recursive
          path: MuMain

      - name: Aplicar parche
        working-directory: MuMain
        run: |
          echo "commit base: $(git rev-parse HEAD)"
          git apply --check ../receta/cliente-mac-parches.patch
          git apply ../receta/cliente-mac-parches.patch
          git apply --check ../receta/parche-11-contenido-extra.patch
          git apply ../receta/parche-11-contenido-extra.patch
          git apply --check ../receta/parche-12-mapas-s8.patch
          git apply ../receta/parche-12-mapas-s8.patch
          git apply --check ../receta/parche-13-terreno-capa2.patch
          git apply ../receta/parche-13-terreno-capa2.patch
          git apply --check ../receta/parche-14-npc-y-textura.patch
          git apply ../receta/parche-14-npc-y-textura.patch
          git apply --check ../receta/parche-15-diagnostico.patch
          git apply ../receta/parche-15-diagnostico.patch
          git apply --check ../receta/parche-16-antes-del-toro.patch
          git apply ../receta/parche-16-antes-del-toro.patch
          git apply --check ../receta/parche-17-diagnostico-mallas.patch
          git apply ../receta/parche-17-diagnostico-mallas.patch
          git apply --check ../receta/parche-18-animacion-y-npc.patch
          git apply ../receta/parche-18-animacion-y-npc.patch
          git apply --check ../receta/parche-19-mineria.patch
          git apply ../receta/parche-19-mineria.patch
          git apply --check ../receta/parche-20-jin-mapa-92.patch
          git apply ../receta/parche-20-jin-mapa-92.patch
          git apply --check ../receta/parche-21-puntos-pisados.patch
          git apply ../receta/parche-21-puntos-pisados.patch
          git apply --check ../receta/parche-22-tirar-items-de-mision.patch
          git apply ../receta/parche-22-tirar-items-de-mision.patch
          git apply --check ../receta/parche-23-usar-consumibles-s8.patch
          git apply ../receta/parche-23-usar-consumibles-s8.patch
          # --- parches 11 a 23: controles de contenido (copiados de build-mac-s8.yml el 18-09-2026; 21, 22 y 23 nuevos) ---
          # --- parche 19: mineria Jewel of Pandora ---
          # el protocolo: el case en el despachador y las tres funciones de envio
          grep -q 'case 0x4C:' src/source/Network/Server/WSclient.cpp \
            && echo "parche 19: el cliente escucha el 0x4C" \
            || { echo "parche 19 no aplicado (case 0x4C)" >&2; exit 1; }
          test "$(grep -c 'void SendPandora' src/source/Network/Server/WSclient.cpp)" = "3" \
            && echo "parche 19: las tres peticiones de mineria" \
            || { echo "parche 19 no aplicado (envio)" >&2; exit 1; }
          # los tamanos del protocolo son los del S8; si alguien mueve un campo, el static_assert lo dice
          test "$(grep -c 'static_assert(sizeof(PMSG_PANDORA' src/source/Network/Server/WSclient.h)" = "5" \
            && echo "parche 19: los 5 guardas de tamano del protocolo" \
            || { echo "parche 19 no aplicado (static_assert)" >&2; exit 1; }
          # las zonas son NPC y se crean sin modelo, o el switch las convierte en Bull Fighter
          grep -q 'case 605:   // Mining Area (Small)' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 19: las zonas son NPC, no bichos" \
            || { echo "parche 19 no aplicado (NPC)" >&2; exit 1; }
          grep -q 'PANDORA_ZONE_MODEL_INDEX' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 19: zonas sin modelo con caja propia" \
            || { echo "parche 19 no aplicado (sin modelo)" >&2; exit 1; }
          grep -q 'MovePandoraMiningZone' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 19: el parpadeo de la zona" \
            || { echo "parche 19 no aplicado (parpadeo)" >&2; exit 1; }
          # el clic y el cartel
          grep -q 'PANDORA_PICK_TYPE' src/source/Engine/Object/ZzzInterface.cpp \
            && echo "parche 19: el clic exige el pico" \
            || { echo "parche 19 no aplicado (clic)" >&2; exit 1; }
          grep -q 'CPandoraMiningMsgBoxLayout' src/source/UI/NewUI/Dialogs/NewUICommonMessageBox.cpp \
            && echo "parche 19: cartel de cobrar o seguir" \
            || { echo "parche 19 no aplicado (cartel)" >&2; exit 1; }
          test "$(grep -c 'PandoraMining' src/Localization/Game.en.resx)" -ge "12" \
            && echo "parche 19: las 12 cadenas de la mineria" \
            || { echo "parche 19 no aplicado (cadenas)" >&2; exit 1; }
          grep -q 'Actions\[MONSTER01_WALK\].PlaySpeed' src/source/Engine/Object/ZzzOpenData.cpp \
            && echo "parche 18: velocidad de animacion de los bichos nuevos" \
            || { echo "parche 18 no aplicado (animacion)" >&2; exit 1; }
          grep -q 'case 583:   // Jin' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 18: los NPC de Acheron son NPC, no bichos" \
            || { echo "parche 18 no aplicado (NPC)" >&2; exit 1; }
          grep -q 'case 604: AcheronNpc = MODEL_ACHERON_NPC_JINN' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 20: Jin del mapa 92 con su modelo, no de toro" \
            || { echo "parche 20 no aplicado (modelo de Jin 604)" >&2; exit 1; }
          grep -q 'Diagnostico malla' src/source/Render/Models/ZzzBMD.cpp \
            && echo "parche 17: diagnostico de mallas sin textura" \
            || { echo "parche 17 no aplicado" >&2; exit 1; }
          # parche 16: el respaldo del S8 va ANTES del switch que termina en Bull Fighter
          grep -q 'CreateSeason8Character' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 16: respaldo del S8 antes del switch" \
            || { echo "parche 16 no aplicado" >&2; exit 1; }
          # parche 15: los tres diagnosticos que van al MuError.log
          test "$(grep -rc 'Diagnostico' src/source/World/MapInfra/MapManager.cpp src/source/Engine/Object/ZzzCharacter.cpp src/source/Engine/Object/ZzzObject.cpp | grep -c ':0')" = "0" \
            && echo "parche 15: diagnosticos en los tres ficheros" \
            || { echo "parche 15 no aplicado" >&2; exit 1; }
          # parche 14: modelos propios de los NPC de Acheron y casillas sin textura
          grep -q 'MODEL_ACHERON_NPC_DERUVISH' src/source/Core/Globals/_enum.h \
            && echo "parche 14: modelos de los NPC de Acheron" \
            || { echo "parche 14 no aplicado (NPC)" >&2; exit 1; }
          grep -q 'Akeron' src/source/Engine/Object/ZzzOpenData.cpp \
            && echo "parche 14: carga de los modelos de Akeron" \
            || { echo "parche 14 no aplicado (carga)" >&2; exit 1; }
          test "$(grep -c 'SafeTileTexture' src/source/Render/Terrain/ZzzLodTerrain.cpp)" -ge "6" \
            && echo "parche 14: guarda de casillas sin textura" \
            || { echo "parche 14 no aplicado (textura de casilla)" >&2; exit 1; }
          # parche 13: una celda sin segunda capa (255) ya no se pinta con una textura que no existe
          test "$(grep -c 'TerrainMappingLayer2\[TerrainIndex1\] != 255' src/source/Render/Terrain/ZzzLodTerrain.cpp)" = "2" \
            && echo "parche 13: guarda de la capa 2 en los dos sitios" \
            || { echo "parche 13 no aplicado (capa 2)" >&2; exit 1; }
          # parche 12: mapas del S8 (nombre, placa, musica) y skills maestras 609-617
          grep -q 'WD_91ACHERON = 91' src/source/World/MapInfra/MapManager.h \
            && echo "parche 12: mundos del S8 en el enum" \
            || { echo "parche 12 no aplicado (enum de mundos)" >&2; exit 1; }
          grep -q 'I18N::Game::Debenter' src/source/World/MapInfra/MapManager.cpp \
            && echo "parche 12: nombre de los mapas nuevos" \
            || { echo "parche 12 no aplicado (nombre de mapa)" >&2; exit 1; }
          grep -q 'MapName_Akeron.tga' src/source/UI/Legacy/UIMapName.cpp \
            && echo "parche 12: placa de Acheron" \
            || { echo "parche 12 no aplicado (placa)" >&2; exit 1; }
          grep -q 'm_bHasImg' src/source/UI/Legacy/UIMapName.cpp \
            && echo "parche 12: un mundo sin placa ya no abre el dialogo que paraba el juego" \
            || { echo "parche 12 no aplicado (guarda de LoadBitmap)" >&2; exit 1; }
          grep -q 'AT_SKILL_MASTER_END = 617' src/source/Core/Globals/_enum.h \
            && echo "parche 12: skills maestras hasta la 617" \
            || { echo "parche 12 no aplicado (skills 609-617)" >&2; exit 1; }
          grep -q 'name="Debenter"' src/Localization/Game.en.resx \
            && echo "parche 12: texto Debenter en la localizacion" \
            || { echo "parche 12 no aplicado (localizacion)" >&2; exit 1; }
          grep -q 'ExtraItems.txt' src/source/Engine/Object/ZzzOpenData.cpp \
            && echo "parche 11: tabla de items extra en el codigo" \
            || { echo "parche 11 no aplicado (items)" >&2; exit 1; }
          grep -q 'GetExtraMonsterModel' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 11: bichos extra en CreateMonster" \
            || { echo "parche 11 no aplicado (bichos)" >&2; exit 1; }
          grep -qF -- 'const SIZE sizeLevel = g_pRenderText->MeasureText(strLevel, (int)wcslen(strLevel));' src/source/UI/NewUI/Character/NewUICharacterInfoWindow.cpp \
            && echo "parche 21: los puntos por repartir ya no se pisan con el nivel" \
            || { echo "parche 21 no aplicado" >&2; exit 1; }
          grep -qF -- 'if ((pItem->Type >= ITEM_FLAME_OF_DEATH_BEAM_KNIGHT && pItem->Type <= ITEM_EYE_OF_ABYSSAL)' src/source/Engine/Object/ZzzInventory.cpp \
            && echo "parche 22: los items de mision se pueden tirar" \
            || { echo "parche 22 no aplicado" >&2; exit 1; }
          grep -qF -- 'if ((pItem->Type >= ITEM_HELPER + 177 && pItem->Type <= ITEM_HELPER + 181) ||' src/source/UI/NewUI/Inventory/NewUIInventoryActionController.cpp \
            && echo "parche 23: los consumibles S8 se usan con clic derecho" \
            || { echo "parche 23 no aplicado" >&2; exit 1; }
          git diff --stat
          test "$(grep -c 'IsPress(VK_LBUTTON) || SEASON3B::IsRelease(VK_LBUTTON)' src/source/UI/NewUI/Inventory/NewUITrade.cpp)" = "1" && echo "parche 4 (intercambio) aplicado en el codigo"
          test "$(grep -c 'IsPress(VK_LBUTTON) || SEASON3B::IsRelease(VK_LBUTTON)' src/source/UI/NewUI/Inventory/NewUIMixInventory.cpp)" = "3" && echo "parche 5 (maquina del caos) aplicado en el codigo"
          # el parche de la opcion 380 no deja rastro en el binario (es una asignacion, no un texto),
          # asi que se comprueba en el fuente ya parcheado
          grep -q "params.HasGuardianOption = (flags & ItemOptionFlags::HasGuardian)" src/source/UI/NewUI/Inventory/NewUIItemMng.cpp \
            && echo "parche 6 (opcion 380 visible) aplicado en el codigo" \
            || { echo "el parche de la opcion 380 NO se aplico" >&2; exit 1; }
          # los textos del MU Helper tampoco dejan rastro buscable en el binario
          grep -q "<value>Basic Skill</value>" src/Localization/Game.es.resx \
            && echo "parche 7 (textos del MU Helper) aplicado en el codigo" \
            || { echo "el parche de los textos NO se aplico" >&2; exit 1; }
          # y el resx tiene que seguir siendo XML valido, o la compilacion de .NET falla mas tarde
          PY=python3; command -v $PY >/dev/null 2>&1 || PY=python
          "$PY" -c "import xml.etree.ElementTree as ET; ET.parse('src/Localization/Game.es.resx')" \
            && echo "Game.es.resx sigue siendo XML valido" \
            || { echo "Game.es.resx quedo malformado" >&2; exit 1; }
          # parche 8: los textos que se perdian en cada actualizacion del cliente
          grep -q "<value>Nivel: %u | Resets: %u</value>" src/Localization/Game.es.resx \
            && echo "parche 8 (nivel y resets, y traducciones malas) aplicado en el codigo" \
            || { echo "el parche 8 NO se aplico" >&2; exit 1; }
          test "$(grep -c "Establecer elemento\|<value>Colocar</value>\|Restablecimientos: %u\|turbas\|Establecer opción\|elemento establecido" src/Localization/Game.es.resx)" = "0" \
            && echo "parche 8: no queda ninguna de las traducciones malas" \
            || { echo "quedan traducciones malas en el resx" >&2; exit 1; }
          # parche 9: la Phoenix Soul Star con skill perdia todas las opciones del tooltip (faltaba el caso del skill Phoenix Shot)
          grep -q "case AT_SKILL_PHOENIX_SHOT:" src/source/Engine/Object/ZzzInventory.cpp \
            && echo "parche 9 (tooltip de la Phoenix Soul Star) aplicado en el codigo" \
            || { echo "el parche 9 NO se aplico" >&2; exit 1; }
          # parche 10: la opcion de la semilla de Tierra esta en la ficha 36 de SocketItem_*.bmd, no en la 34
          test "$(grep -c 'SocketSeedID = 36 + iLevel;' src/source/Network/Server/SocketSystem.cpp)" = "3" \
            && echo "parche 10 (semilla de Tierra, ficha 36) aplicado en el codigo" \
            || { echo "el parche 10 NO se aplico" >&2; exit 1; }

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Herramientas (Homebrew)
        run: brew install cmake ninja openssl@3 curl brotli glslang spirv-cross jpeg-turbo

      - name: Configurar
        working-directory: MuMain
        run: >
          cmake --preset macos-arm64
          -B out/build/macos-ci
          -DENABLE_EDITOR=OFF
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Compilar
        working-directory: MuMain
        run: cmake --build out/build/macos-ci --config Release

      - name: Tests
        working-directory: MuMain
        run: >
          ctest --test-dir out/build/macos-ci --build-config Release
          --output-on-failure
          --no-tests=error

      - name: Validar runtime y parches
        working-directory: MuMain
        run: |
          rt="out/build/macos-ci/src/Release/Main.app/Contents/MacOS"
          for p in "$rt/Main" "$rt/MUnique.Client.Library.dylib" "$rt/config.ini" "$rt/shaders"; do
            if [ ! -e "$p" ]; then echo "falta: $p" >&2; exit 1; fi
          done
          for p in "$rt/Data" "$rt/fonts"; do
            if [ -e "$p" ]; then echo "data inesperada en el runtime: $p" >&2; exit 1; fi
          done
          file "$rt/Main"
          echo "--- librerias que carga Main:"
          otool -L "$rt/Main"
          echo "--- shaders:"
          ls "$rt/shaders"
          if LC_ALL=C grep -a -q "not retrying until another track is requested" "$rt/Main"; then
            echo "parche de musica presente en el binario"
          else
            echo "el parche de musica NO esta en el binario" >&2; exit 1
          fi
          if grep -q "ServerIP=localhost" "$rt/config.ini"; then
            echo "config.ini es la plantilla (localhost)"
          else
            echo "config.ini inesperado" >&2; exit 1
          fi

      - name: Empaquetar
        run: |
          NOMBRE="MuMain-macos-native-arm64-release-editor-off-no-data-parchado.tar.gz"
          tar -czf "$NOMBRE" -C MuMain/out/build/macos-ci/src/Release Main.app
          shasum -a 256 "$NOMBRE"
          ls -l "$NOMBRE"

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cliente-mac-parchado
          path: MuMain-macos-native-arm64-release-editor-off-no-data-parchado.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows x64 Release (editor OFF) con parches
    runs-on: windows-latest

    steps:
      - name: Receta y parche (este repositorio)
        uses: actions/checkout@v4
        with:
          path: receta

      - name: Codigo de MuMain v1.2.5 (con submodulos)
        uses: actions/checkout@v4
        with:
          repository: yesid-bocanegra/MuMain
          ref: v1.2.5
          submodules: recursive
          path: MuMain

      - name: Aplicar parche
        shell: bash
        working-directory: MuMain
        run: |
          echo "commit base: $(git rev-parse HEAD)"
          git apply --check ../receta/cliente-mac-parches.patch
          git apply ../receta/cliente-mac-parches.patch
          git apply --check ../receta/parche-11-contenido-extra.patch
          git apply ../receta/parche-11-contenido-extra.patch
          git apply --check ../receta/parche-12-mapas-s8.patch
          git apply ../receta/parche-12-mapas-s8.patch
          git apply --check ../receta/parche-13-terreno-capa2.patch
          git apply ../receta/parche-13-terreno-capa2.patch
          git apply --check ../receta/parche-14-npc-y-textura.patch
          git apply ../receta/parche-14-npc-y-textura.patch
          git apply --check ../receta/parche-15-diagnostico.patch
          git apply ../receta/parche-15-diagnostico.patch
          git apply --check ../receta/parche-16-antes-del-toro.patch
          git apply ../receta/parche-16-antes-del-toro.patch
          git apply --check ../receta/parche-17-diagnostico-mallas.patch
          git apply ../receta/parche-17-diagnostico-mallas.patch
          git apply --check ../receta/parche-18-animacion-y-npc.patch
          git apply ../receta/parche-18-animacion-y-npc.patch
          git apply --check ../receta/parche-19-mineria.patch
          git apply ../receta/parche-19-mineria.patch
          git apply --check ../receta/parche-20-jin-mapa-92.patch
          git apply ../receta/parche-20-jin-mapa-92.patch
          git apply --check ../receta/parche-21-puntos-pisados.patch
          git apply ../receta/parche-21-puntos-pisados.patch
          git apply --check ../receta/parche-22-tirar-items-de-mision.patch
          git apply ../receta/parche-22-tirar-items-de-mision.patch
          git apply --check ../receta/parche-23-usar-consumibles-s8.patch
          git apply ../receta/parche-23-usar-consumibles-s8.patch
          # --- parches 11 a 23: controles de contenido (copiados de build-mac-s8.yml el 18-09-2026; 21, 22 y 23 nuevos) ---
          # --- parche 19: mineria Jewel of Pandora ---
          # el protocolo: el case en el despachador y las tres funciones de envio
          grep -q 'case 0x4C:' src/source/Network/Server/WSclient.cpp \
            && echo "parche 19: el cliente escucha el 0x4C" \
            || { echo "parche 19 no aplicado (case 0x4C)" >&2; exit 1; }
          test "$(grep -c 'void SendPandora' src/source/Network/Server/WSclient.cpp)" = "3" \
            && echo "parche 19: las tres peticiones de mineria" \
            || { echo "parche 19 no aplicado (envio)" >&2; exit 1; }
          # los tamanos del protocolo son los del S8; si alguien mueve un campo, el static_assert lo dice
          test "$(grep -c 'static_assert(sizeof(PMSG_PANDORA' src/source/Network/Server/WSclient.h)" = "5" \
            && echo "parche 19: los 5 guardas de tamano del protocolo" \
            || { echo "parche 19 no aplicado (static_assert)" >&2; exit 1; }
          # las zonas son NPC y se crean sin modelo, o el switch las convierte en Bull Fighter
          grep -q 'case 605:   // Mining Area (Small)' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 19: las zonas son NPC, no bichos" \
            || { echo "parche 19 no aplicado (NPC)" >&2; exit 1; }
          grep -q 'PANDORA_ZONE_MODEL_INDEX' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 19: zonas sin modelo con caja propia" \
            || { echo "parche 19 no aplicado (sin modelo)" >&2; exit 1; }
          grep -q 'MovePandoraMiningZone' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 19: el parpadeo de la zona" \
            || { echo "parche 19 no aplicado (parpadeo)" >&2; exit 1; }
          # el clic y el cartel
          grep -q 'PANDORA_PICK_TYPE' src/source/Engine/Object/ZzzInterface.cpp \
            && echo "parche 19: el clic exige el pico" \
            || { echo "parche 19 no aplicado (clic)" >&2; exit 1; }
          grep -q 'CPandoraMiningMsgBoxLayout' src/source/UI/NewUI/Dialogs/NewUICommonMessageBox.cpp \
            && echo "parche 19: cartel de cobrar o seguir" \
            || { echo "parche 19 no aplicado (cartel)" >&2; exit 1; }
          test "$(grep -c 'PandoraMining' src/Localization/Game.en.resx)" -ge "12" \
            && echo "parche 19: las 12 cadenas de la mineria" \
            || { echo "parche 19 no aplicado (cadenas)" >&2; exit 1; }
          grep -q 'Actions\[MONSTER01_WALK\].PlaySpeed' src/source/Engine/Object/ZzzOpenData.cpp \
            && echo "parche 18: velocidad de animacion de los bichos nuevos" \
            || { echo "parche 18 no aplicado (animacion)" >&2; exit 1; }
          grep -q 'case 583:   // Jin' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 18: los NPC de Acheron son NPC, no bichos" \
            || { echo "parche 18 no aplicado (NPC)" >&2; exit 1; }
          grep -q 'case 604: AcheronNpc = MODEL_ACHERON_NPC_JINN' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 20: Jin del mapa 92 con su modelo, no de toro" \
            || { echo "parche 20 no aplicado (modelo de Jin 604)" >&2; exit 1; }
          grep -q 'Diagnostico malla' src/source/Render/Models/ZzzBMD.cpp \
            && echo "parche 17: diagnostico de mallas sin textura" \
            || { echo "parche 17 no aplicado" >&2; exit 1; }
          # parche 16: el respaldo del S8 va ANTES del switch que termina en Bull Fighter
          grep -q 'CreateSeason8Character' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 16: respaldo del S8 antes del switch" \
            || { echo "parche 16 no aplicado" >&2; exit 1; }
          # parche 15: los tres diagnosticos que van al MuError.log
          test "$(grep -rc 'Diagnostico' src/source/World/MapInfra/MapManager.cpp src/source/Engine/Object/ZzzCharacter.cpp src/source/Engine/Object/ZzzObject.cpp | grep -c ':0')" = "0" \
            && echo "parche 15: diagnosticos en los tres ficheros" \
            || { echo "parche 15 no aplicado" >&2; exit 1; }
          # parche 14: modelos propios de los NPC de Acheron y casillas sin textura
          grep -q 'MODEL_ACHERON_NPC_DERUVISH' src/source/Core/Globals/_enum.h \
            && echo "parche 14: modelos de los NPC de Acheron" \
            || { echo "parche 14 no aplicado (NPC)" >&2; exit 1; }
          grep -q 'Akeron' src/source/Engine/Object/ZzzOpenData.cpp \
            && echo "parche 14: carga de los modelos de Akeron" \
            || { echo "parche 14 no aplicado (carga)" >&2; exit 1; }
          test "$(grep -c 'SafeTileTexture' src/source/Render/Terrain/ZzzLodTerrain.cpp)" -ge "6" \
            && echo "parche 14: guarda de casillas sin textura" \
            || { echo "parche 14 no aplicado (textura de casilla)" >&2; exit 1; }
          # parche 13: una celda sin segunda capa (255) ya no se pinta con una textura que no existe
          test "$(grep -c 'TerrainMappingLayer2\[TerrainIndex1\] != 255' src/source/Render/Terrain/ZzzLodTerrain.cpp)" = "2" \
            && echo "parche 13: guarda de la capa 2 en los dos sitios" \
            || { echo "parche 13 no aplicado (capa 2)" >&2; exit 1; }
          # parche 12: mapas del S8 (nombre, placa, musica) y skills maestras 609-617
          grep -q 'WD_91ACHERON = 91' src/source/World/MapInfra/MapManager.h \
            && echo "parche 12: mundos del S8 en el enum" \
            || { echo "parche 12 no aplicado (enum de mundos)" >&2; exit 1; }
          grep -q 'I18N::Game::Debenter' src/source/World/MapInfra/MapManager.cpp \
            && echo "parche 12: nombre de los mapas nuevos" \
            || { echo "parche 12 no aplicado (nombre de mapa)" >&2; exit 1; }
          grep -q 'MapName_Akeron.tga' src/source/UI/Legacy/UIMapName.cpp \
            && echo "parche 12: placa de Acheron" \
            || { echo "parche 12 no aplicado (placa)" >&2; exit 1; }
          grep -q 'm_bHasImg' src/source/UI/Legacy/UIMapName.cpp \
            && echo "parche 12: un mundo sin placa ya no abre el dialogo que paraba el juego" \
            || { echo "parche 12 no aplicado (guarda de LoadBitmap)" >&2; exit 1; }
          grep -q 'AT_SKILL_MASTER_END = 617' src/source/Core/Globals/_enum.h \
            && echo "parche 12: skills maestras hasta la 617" \
            || { echo "parche 12 no aplicado (skills 609-617)" >&2; exit 1; }
          grep -q 'name="Debenter"' src/Localization/Game.en.resx \
            && echo "parche 12: texto Debenter en la localizacion" \
            || { echo "parche 12 no aplicado (localizacion)" >&2; exit 1; }
          grep -q 'ExtraItems.txt' src/source/Engine/Object/ZzzOpenData.cpp \
            && echo "parche 11: tabla de items extra en el codigo" \
            || { echo "parche 11 no aplicado (items)" >&2; exit 1; }
          grep -q 'GetExtraMonsterModel' src/source/Engine/Object/ZzzCharacter.cpp \
            && echo "parche 11: bichos extra en CreateMonster" \
            || { echo "parche 11 no aplicado (bichos)" >&2; exit 1; }
          grep -qF -- 'const SIZE sizeLevel = g_pRenderText->MeasureText(strLevel, (int)wcslen(strLevel));' src/source/UI/NewUI/Character/NewUICharacterInfoWindow.cpp \
            && echo "parche 21: los puntos por repartir ya no se pisan con el nivel" \
            || { echo "parche 21 no aplicado" >&2; exit 1; }
          grep -qF -- 'if ((pItem->Type >= ITEM_FLAME_OF_DEATH_BEAM_KNIGHT && pItem->Type <= ITEM_EYE_OF_ABYSSAL)' src/source/Engine/Object/ZzzInventory.cpp \
            && echo "parche 22: los items de mision se pueden tirar" \
            || { echo "parche 22 no aplicado" >&2; exit 1; }
          grep -qF -- 'if ((pItem->Type >= ITEM_HELPER + 177 && pItem->Type <= ITEM_HELPER + 181) ||' src/source/UI/NewUI/Inventory/NewUIInventoryActionController.cpp \
            && echo "parche 23: los consumibles S8 se usan con clic derecho" \
            || { echo "parche 23 no aplicado" >&2; exit 1; }
          git diff --stat
          test "$(grep -c 'IsPress(VK_LBUTTON) || SEASON3B::IsRelease(VK_LBUTTON)' src/source/UI/NewUI/Inventory/NewUITrade.cpp)" = "1" && echo "parche 4 (intercambio) aplicado en el codigo"
          test "$(grep -c 'IsPress(VK_LBUTTON) || SEASON3B::IsRelease(VK_LBUTTON)' src/source/UI/NewUI/Inventory/NewUIMixInventory.cpp)" = "3" && echo "parche 5 (maquina del caos) aplicado en el codigo"
          # el parche de la opcion 380 no deja rastro en el binario (es una asignacion, no un texto),
          # asi que se comprueba en el fuente ya parcheado
          grep -q "params.HasGuardianOption = (flags & ItemOptionFlags::HasGuardian)" src/source/UI/NewUI/Inventory/NewUIItemMng.cpp \
            && echo "parche 6 (opcion 380 visible) aplicado en el codigo" \
            || { echo "el parche de la opcion 380 NO se aplico" >&2; exit 1; }
          # los textos del MU Helper tampoco dejan rastro buscable en el binario
          grep -q "<value>Basic Skill</value>" src/Localization/Game.es.resx \
            && echo "parche 7 (textos del MU Helper) aplicado en el codigo" \
            || { echo "el parche de los textos NO se aplico" >&2; exit 1; }
          # y el resx tiene que seguir siendo XML valido, o la compilacion de .NET falla mas tarde
          PY=python3; command -v $PY >/dev/null 2>&1 || PY=python
          "$PY" -c "import xml.etree.ElementTree as ET; ET.parse('src/Localization/Game.es.resx')" \
            && echo "Game.es.resx sigue siendo XML valido" \
            || { echo "Game.es.resx quedo malformado" >&2; exit 1; }
          # parche 8: los textos que se perdian en cada actualizacion del cliente
          grep -q "<value>Nivel: %u | Resets: %u</value>" src/Localization/Game.es.resx \
            && echo "parche 8 (nivel y resets, y traducciones malas) aplicado en el codigo" \
            || { echo "el parche 8 NO se aplico" >&2; exit 1; }
          test "$(grep -c "Establecer elemento\|<value>Colocar</value>\|Restablecimientos: %u\|turbas\|Establecer opción\|elemento establecido" src/Localization/Game.es.resx)" = "0" \
            && echo "parche 8: no queda ninguna de las traducciones malas" \
            || { echo "quedan traducciones malas en el resx" >&2; exit 1; }
          # parche 9: la Phoenix Soul Star con skill perdia todas las opciones del tooltip (faltaba el caso del skill Phoenix Shot)
          grep -q "case AT_SKILL_PHOENIX_SHOT:" src/source/Engine/Object/ZzzInventory.cpp \
            && echo "parche 9 (tooltip de la Phoenix Soul Star) aplicado en el codigo" \
            || { echo "el parche 9 NO se aplico" >&2; exit 1; }
          # parche 10: la opcion de la semilla de Tierra esta en la ficha 36 de SocketItem_*.bmd, no en la 34
          test "$(grep -c 'SocketSeedID = 36 + iLevel;' src/source/Network/Server/SocketSystem.cpp)" = "3" \
            && echo "parche 10 (semilla de Tierra, ficha 36) aplicado en el codigo" \
            || { echo "el parche 10 NO se aplico" >&2; exit 1; }

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Entorno de Visual Studio (MSVC x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Cache de FetchContent y NuGet
        uses: actions/cache@v4
        with:
          path: |
            MuMain/out/build/windows-ci-x64-release/_deps
            MuMain/.nuget
          key: windows-x64-release-deps-${{ hashFiles('MuMain/CMakeLists.txt', 'MuMain/src/CMakeLists.txt', 'MuMain/ClientLibrary/**/*.csproj', 'MuMain/ClientLibrary/**/*.props') }}
          restore-keys: windows-x64-release-deps-

      - name: Cache de vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-windows-x64-${{ hashFiles('MuMain/vcpkg.json') }}
          restore-keys: vcpkg-windows-x64-

      - name: Configurar
        working-directory: MuMain
        run: >
          cmake --preset windows-x64
          -B out/build/windows-ci-x64-release
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/MuMain/toolchain-x64.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed
          -DVCPKG_MANIFEST_MODE=ON
          -DENABLE_EDITOR=OFF
          -DMU_ENABLE_SHADER_COMPILATION=ON
          -DGLSLANG_EXE=C:/vcpkg/installed/x64-windows/tools/glslang/glslangValidator.exe
          -DSPIRV_CROSS_EXE=C:/vcpkg/installed/x64-windows/tools/spirv-cross/spirv-cross.exe
          -DDXC_EXE=C:/vcpkg/installed/x64-windows/tools/directx-dxc/dxc.exe
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=ON

      - name: Compilar
        working-directory: MuMain
        run: cmake --build out/build/windows-ci-x64-release --config Release

      - name: Tests
        working-directory: MuMain
        run: >
          ctest --test-dir out/build/windows-ci-x64-release --build-config Release
          --output-on-failure
          --no-tests=error

      - name: Copiar el runtime de MSVC junto al ejecutable
        shell: pwsh
        working-directory: MuMain
        run: |
          $runtimeDirectory = "out/build/windows-ci-x64-release/src/Release"
          if (-not (Test-Path -LiteralPath $runtimeDirectory -PathType Container)) {
            throw "Falta la carpeta del runtime: $runtimeDirectory"
          }
          if ([string]::IsNullOrWhiteSpace($env:VCToolsRedistDir)) {
            throw "VCToolsRedistDir no esta en el entorno de MSVC."
          }
          $crtDirectories = @(Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT")
          if ($crtDirectories.Count -ne 1) {
            throw "Se esperaba una carpeta Microsoft.VC*.CRT; hay $($crtDirectories.Count)."
          }
          $crtDlls = @(Get-ChildItem -LiteralPath $crtDirectories[0].FullName -File -Filter "*.dll" | Sort-Object Name)
          if ($crtDlls.Count -eq 0) { throw "La carpeta del CRT no tiene DLL." }
          Copy-Item -LiteralPath $crtDlls.FullName -Destination $runtimeDirectory -Force
          Write-Host "CRT copiado: $($crtDlls.Name -join ', ')"

      - name: Validar runtime y parches
        shell: pwsh
        working-directory: MuMain
        run: |
          $runtimeDirectory = "out/build/windows-ci-x64-release/src/Release"
          foreach ($path in @("$runtimeDirectory/Main.exe", "$runtimeDirectory/MUnique.Client.Library.dll", "$runtimeDirectory/config.ini")) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Falta: $path" }
          }
          if (-not (Test-Path -LiteralPath "$runtimeDirectory/shaders" -PathType Container)) { throw "Falta la carpeta shaders" }
          foreach ($path in @("$runtimeDirectory/Data", "$runtimeDirectory/fonts")) {
            if (Test-Path -LiteralPath $path) { throw "Data inesperada en el runtime: $path" }
          }
          $shaders = @(Get-ChildItem -LiteralPath "$runtimeDirectory/shaders" -File -Recurse)
          if ($shaders.Count -ne 18) { throw "Se esperaban 18 shaders; hay $($shaders.Count)." }

          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $binaries = @(Get-ChildItem -LiteralPath $runtimeDirectory -File -Recurse | Where-Object { $_.Extension -in @(".exe", ".dll") } | Sort-Object FullName)
          foreach ($binary in $binaries) {
            $headers = @(& $dumpbin /headers $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin fallo con $($binary.Name)" }
            $machine = @($headers | Select-String -Pattern '^\s*8664 machine \(x64\)\s*$')
            if ($machine.Count -ne 1) { throw "$($binary.Name) no es x64" }
            $dependents = (& $dumpbin /DEPENDENTS $binary.FullName 2>&1) -join "`n"
            if ($dependents -match '(?im)^\s*(?:ucrtbased|(?:vcruntime|msvcp|concrt|vcomp)[0-9]+(?:_[a-z0-9_]+)?d)\.dll\s*$') {
              throw "$($binary.Name) importa un CRT de debug"
            }
          }
          Write-Host "Binarios x64 validados: $($binaries.Count)"

          $exeText = [System.IO.File]::ReadAllText("$runtimeDirectory/Main.exe", [System.Text.Encoding]::Latin1)
          if ($exeText.Contains("not retrying until another track is requested")) {
            Write-Host "parche de musica presente en Main.exe"
          } else {
            throw "el parche de musica NO esta en Main.exe"
          }
          if ((Get-Content -LiteralPath "$runtimeDirectory/config.ini" -Raw) -match "ServerIP=localhost") {
            Write-Host "config.ini es la plantilla (localhost)"
          } else {
            throw "config.ini inesperado"
          }
          Write-Host "--- contenido del runtime:"
          Get-ChildItem -LiteralPath $runtimeDirectory -Recurse | ForEach-Object { $_.FullName.Substring((Resolve-Path $runtimeDirectory).Path.Length + 1) + "  " + $_.Length }

      - name: Empaquetar (zip para jugadores + tar.gz del runtime completo)
        shell: pwsh
        run: |
          $runtimeDirectory = "MuMain/out/build/windows-ci-x64-release/src/Release"
          $stage = "stage-jugadores"
          New-Item -ItemType Directory -Path $stage | Out-Null
          # Para los jugadores: todo el runtime menos config.ini (cada uno conserva el suyo) y los .pdb
          Get-ChildItem -LiteralPath $runtimeDirectory -Force | Where-Object { $_.Name -ne "config.ini" -and $_.Extension -ne ".pdb" } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stage -Recurse -Force
          }
          $zip = "Mu-cliente-windows-parche9.zip"
          Push-Location $stage
          & 7z a -tzip -mx=9 "..\$zip" * | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z fallo" }
          Pop-Location
          Write-Host "--- contenido del zip:"
          & 7z l $zip
          $tgz = "MuMain-windows-native-x64-release-editor-off-no-data-parchado.tar.gz"
          tar -czf $tgz -C $runtimeDirectory .
          Get-FileHash -Algorithm SHA256 $zip, $tgz | Format-Table -AutoSize
          Get-Item $zip, $tgz | Format-Table Name, Length -AutoSize

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cliente-windows-parchado
          path: |
            Mu-cliente-windows-parche9.zip
            MuMain-windows-native-x64-release-editor-off-no-data-parchado.tar.gz
          if-no-files-found: error

  publicar:
    name: Publicar release con los dos clientes
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Bajar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artefactos
          ls -l
          sha256sum *.zip *.tar.gz | tee sha256.txt
          TAG="v1.2.5-s8-parche23-r${{ github.run_number }}"
          {
            echo "CLIENTE CON CONTENIDO SEASON 8: MuMain v1.2.5 (fork yesid-bocanegra, tag v1.2.5) compilado desde la rama ${{ github.ref_name }} (commit ${{ github.sha }}) con los parches 1 a 23:"
            echo "los diez del cliente S6 (cliente-mac-parches.patch: shaders, musica, nombres largos en MU Helper, intercambio, maquina del caos, opcion 380 visible, textos del MU Helper en ingles, traducciones arregladas, tooltip de la Phoenix Soul Star, semilla de Tierra),"
            echo "los diez del Season 8 (parche-11 a parche-20: contenido extra, mapas nuevos, terreno capa 2, NPC y texturas, diagnostico, bichos S8 antes del toro, mallas, animacion y NPC, mineria de la Jewel of Pandora, Jin en el mapa 92),"
            echo "el 21 (los puntos por repartir se pisaban con el nivel), el 22 (los items de mision se pueden tirar) y el 23 (los consumibles S8, talismanes y sellos de Ascension, Blessing of Light y Scroll Master, se usan con clic derecho: antes el cliente los tiraba al piso). Editor OFF, sin data."
            echo
            echo "- Mac (arm64): MuMain-macos-native-arm64-release-editor-off-no-data-parchado.tar.gz, para actualizar-cliente-mac.sh"
            echo "- Windows (x64), jugadores: Mu-cliente-windows-parche9.zip (Main.exe, DLL y shaders; sin Data, fonts ni config.ini: se descomprime encima de la carpeta del juego)"
            echo "- Windows (x64), runtime completo con config.ini de plantilla: MuMain-windows-native-x64-release-editor-off-no-data-parchado.tar.gz"
            echo
            echo "sha256:"
            echo '```'
            cat sha256.txt
            echo '```'
          } > notas.md
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Clientes Mac y Windows con contenido S8 ($TAG)" --notes-file notas.md *.zip *.tar.gz sha256.txt
